      media="print"

      rel="stylesheet"
    />

    <!-- Print stylesheet: ensures clean output -->
    <style>
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; color: black !important; }
      }
    </style>
  </head>
  <body class="bg-[#f8f9ff] text-[#0d1c2f] antialiased selection:bg-[#dce1ff] selection:text-[#00164e]">
